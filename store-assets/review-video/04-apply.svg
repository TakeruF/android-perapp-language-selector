  <text x="70" y="315" font-family="Arial, sans-serif" font-size="27" fill="#4E5261">All processing stays on the device.</text>
  <rect x="70" y="378" width="770" height="126" rx="24" fill="#E1E8FF"/>
  <text x="105" y="431" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#354C8A">No off-device collection</text>
  <text x="105" y="475" font-family="Arial, sans-serif" font-size="25" fill="#4E5261">No Internet permission, ads, or analytics.</text>
